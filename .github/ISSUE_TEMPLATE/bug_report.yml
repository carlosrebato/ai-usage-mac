name: Bug report
description: Report a reproducible AI Usage problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach credentials or real conversation logs.
  - type: input
    id: version
    attributes:
      label: AI Usage version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
