name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build app for analysis
        run: >-
          xcodebuild
          -project AIUsage.xcodeproj
          -scheme AIUsageMac
          -configuration Debug
          -destination 'generic/platform=macOS'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          SWIFT_COMPILATION_MODE=wholemodule
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: github/codeql-action/analyze@v4
